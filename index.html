<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback</title>
<style>
  :root {
    --ink: #232323;
    --paper: #EFEAE2;
    --card: #FFFFFF;
    --line: #C9C2B4;
    --accent: #2F5D50;
    --error: #A6432A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .sheet {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    padding: 40px 36px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 1.7rem;
    font-weight: 400;
    letter-spacing: 0.2px;
  }

  .lede {
    margin: 0 0 32px;
    font-size: 0.95rem;
    color: #5b564d;
    line-height: 1.5;
  }

  label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    color: #4a4640;
  }

  .field {
    margin-bottom: 20px;
  }

  input, textarea {
    width: 100%;
    border: none;
    border-bottom: 1px solid var(--line);
    background: transparent;
    padding: 8px 2px;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
  }

  input:focus, textarea:focus {
    outline: none;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 7px;
  }

  textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.4;
  }

  .error-msg {
    display: none;
    font-size: 0.8rem;
    color: var(--error);
    margin-top: 5px;
    font-family: -apple-system, sans-serif;
  }

  .field.invalid .error-msg {
    display: block;
  }

  .field.invalid input,
  .field.invalid textarea {
    border-bottom-color: var(--error);
  }

  button {
    margin-top: 8px;
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: -apple-system, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover {
    background: #244a40;
  }

  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .thanks {
    display: none;
    text-align: center;
  }

  .thanks.show {
    display: block;
  }

  .thanks .mark {
    font-size: 2rem;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .thanks h1 {
    margin-bottom: 10px;
  }

  .thanks p {
    color: #5b564d;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  form.hide {
    display: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="sheet">
  <form id="feedbackForm" novalidate>
    <h1>Share your feedback</h1>
    <p class="lede">Tell us what's working and what isn't. We read every note.</p>

    <div class="field" id="nameField">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autocomplete="name">
      <div class="error-msg">Enter your name.</div>
    </div>

    <div class="field" id="emailField">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email">
      <div class="error-msg">Enter a valid email address.</div>
    </div>

    <div class="field" id="messageField">
      <label for="message">Message</label>
      <textarea id="message" name="message"></textarea>
      <div class="error-msg">Say a bit more — at least 10 characters.</div>
    </div>

    <button type="submit">Send feedback</button>
  </form>

  <div class="thanks" id="thanksMessage">
    <div class="mark">&#10003;</div>
    <h1>Thanks for the feedback</h1>
    <p>We've received your message and will take it from here.</p>
  </div>
</div>

<script>
  const form = document.getElementById('feedbackForm');
  const thanks = document.getElementById('thanksMessage');

  const fields = {
    name: {
      el: document.getElementById('name'),
      wrap: document.getElementById('nameField'),
      validate: v => v.trim().length > 0
    },
    email: {
      el: document.getElementById('email'),
      wrap: document.getElementById('emailField'),
      validate: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim())
    },
    message: {
      el: document.getElementById('message'),
      wrap: document.getElementById('messageField'),
      validate: v => v.trim().length >= 10
    }
  };

  function validateField(key) {
    const f = fields[key];
    const ok = f.validate(f.el.value);
    f.wrap.classList.toggle('invalid', !ok);
    return ok;
  }

  Object.keys(fields).forEach(key => {
    fields[key].el.addEventListener('input', () => {
      if (fields[key].wrap.classList.contains('invalid')) {
        validateField(key);
      }
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const results = Object.keys(fields).map(validateField);
    const allValid = results.every(Boolean);

    if (allValid) {
      form.classList.add('hide');
      thanks.classList.add('show');
    } else {
      const firstInvalid = Object.keys(fields).find(key => fields[key].wrap.classList.contains('invalid'));
      if (firstInvalid) fields[firstInvalid].el.focus();
    }
  });
</script>

</body>
</html>
